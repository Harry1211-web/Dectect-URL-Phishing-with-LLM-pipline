<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Phishing detection pipeline: Layer A, B, C, D</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .box { stroke-width: 1.6; rx: 10; }
      .t { font-size: 15px; font-weight: 600; fill: #0f172a; }
      .s { font-size: 12.5px; fill: #334155; }
      .e { font-size: 12.5px; font-weight: 600; }
      .ln { stroke: #475569; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
      .lbl { font-size: 11.5px; fill: #475569; }
    </style>
  </defs>
  <rect width="1000" height="760" fill="#ffffff"/>

  <!-- input -->
  <rect x="330" y="20" width="300" height="46" class="box" fill="#f1f5f9" stroke="#64748b"/>
  <text x="480" y="49" text-anchor="middle" class="t">URL clicked by the user</text>
  <path d="M480,66 L480,96" class="ln"/>

  <!-- Layer A -->
  <rect x="230" y="98" width="500" height="92" class="box" fill="#fee2e2" stroke="#dc2626"/>
  <text x="480" y="122" text-anchor="middle" class="t">Layer A — known phishing</text>
  <text x="480" y="143" text-anchor="middle" class="s">Blocklists: OpenPhish (1 h), PhishTank + Phishing.Database (6 h); redirect targets too</text>
  <text x="480" y="161" text-anchor="middle" class="s">Trusted official brand domain (no user content, no hidden redirect)</text>
  <text x="480" y="179" text-anchor="middle" class="s">then VirusTotal URL report (≥ 2 engines malicious; cached, never submits URLs)</text>
  <path d="M730,130 L800,130" class="ln"/>
  <text x="808" y="134" class="e" fill="#b91c1c">PHISHING (blocked)</text>
  <path d="M730,158 L800,158" class="ln"/>
  <text x="808" y="162" class="e" fill="#15803d">CLEAN (official domain)</text>
  <path d="M480,190 L480,222" class="ln"/>

  <!-- Layer B -->
  <rect x="230" y="224" width="500" height="74" class="box" fill="#ffedd5" stroke="#ea580c"/>
  <text x="480" y="248" text-anchor="middle" class="t">Layer B — brand impersonation</text>
  <text x="480" y="269" text-anchor="middle" class="s">Keywords of the whole URL (domain, subdomains, path, redirects) vs brand catalogue</text>
  <text x="480" y="287" text-anchor="middle" class="s">Damerau-Levenshtein + Jaro-Winkler; flag goes to D as evidence</text>
  <path d="M480,298 L480,330" class="ln"/>

  <!-- Layer C -->
  <rect x="230" y="332" width="500" height="112" class="box" fill="#dbeafe" stroke="#2563eb"/>
  <text x="480" y="356" text-anchor="middle" class="t">Layer C — machine learning gate (high recall)</text>
  <text x="480" y="377" text-anchor="middle" class="s">BiLSTM URL model (cross-fitted) → score  +  URL / host features (DNS, TLS, RDAP, Tranco)</text>
  <text x="480" y="395" text-anchor="middle" class="s">→ XGBoost, lexical or host branch, per-segment thresholds (pair chosen on val)</text>
  <text x="480" y="413" text-anchor="middle" class="s">DOM model (page structure) may only add suspicion — off: failed the val rule</text>
  <text x="480" y="431" text-anchor="middle" class="s">Host lookup failed → suspicious (fail-closed)</text>
  <path d="M730,388 L800,388" class="ln"/>
  <text x="808" y="384" class="e" fill="#15803d">CLEAN</text>
  <text x="808" y="400" class="lbl">(not flagged by B)</text>
  <path d="M480,444 L480,476" class="ln"/>
  <text x="490" y="465" class="lbl">suspicious or B flag</text>

  <!-- Layer D -->
  <rect x="230" y="478" width="500" height="112" class="box" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="480" y="502" text-anchor="middle" class="t">Layer D — LLM guard</text>
  <text x="480" y="523" text-anchor="middle" class="s">Page sanitized: hidden text, same-colour text, comments, invisible characters,</text>
  <text x="480" y="541" text-anchor="middle" class="s">injected instructions (patterns loaded from data/injection_patterns/*.json)</text>
  <text x="480" y="559" text-anchor="middle" class="s">English prompt, page framed as DATA (nonce markers), B flag + technical warnings</text>
  <text x="480" y="577" text-anchor="middle" class="s">Explanation in the user's language on request (default Vietnamese)</text>
  <path d="M480,590 L480,622" class="ln"/>

  <!-- verdicts -->
  <rect x="80" y="624" width="250" height="56" class="box" fill="#fee2e2" stroke="#dc2626"/>
  <text x="205" y="648" text-anchor="middle" class="e" fill="#b91c1c">PHISHING</text>
  <text x="205" y="666" text-anchor="middle" class="s">credentials / impersonation / scam</text>
  <rect x="355" y="624" width="250" height="56" class="box" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="480" y="648" text-anchor="middle" class="e" fill="#a16207">SUSPICIOUS (warn)</text>
  <text x="480" y="666" text-anchor="middle" class="s">missing evidence; or safe but C ≥ 0.99</text>
  <rect x="630" y="624" width="250" height="56" class="box" fill="#dcfce7" stroke="#16a34a"/>
  <text x="755" y="648" text-anchor="middle" class="e" fill="#15803d">SAFE</text>
  <text x="755" y="666" text-anchor="middle" class="s">legitimate purpose on its own domain</text>
  <path d="M480,606 L205,606 L205,622" class="ln"/>
  <path d="M480,606 L755,606 L755,622" class="ln"/>

  <text x="500" y="718" text-anchor="middle" class="s">LLM timeout / error → fallback rules: B flag or very high C score → phishing, otherwise suspicious</text>
  <text x="500" y="740" text-anchor="middle" class="lbl">Every threshold and model choice is made on validation / dev data; test sets are scored once.</text>
</svg>
